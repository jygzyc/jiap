[workspace]
resolver = "2"
members = [
    "crates/decx-json",
    "crates/decx-apk",
    "crates/decx-core",
    "crates/decx-taint",
    "crates/decx-server",
    "crates/decx-engine",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
