# --- from mastg-android-webview-allow-local-access.yml ---
  - id: mastg-android-webview-settings
    severity: INFO
    languages:
      - java
    metadata:
      summary: This rule detects WebView settings related to local file access and JavaScript execution.
    message: "[MASVS-PLATFORM-2] Detected WebView settings."
    pattern-either:
      - pattern: $WEBVIEW.getSettings(...);
      - pattern: $SETTINGS.setJavaScriptEnabled($ARG);
      - pattern: $SETTINGS.setAllowContentAccess($ARG);
      - pattern: $SETTINGS.setAllowFileAccessFromFileURLs($ARG);
      - pattern: $SETTINGS.setAllowFileAccess($ARG);
      - pattern: $SETTINGS.setAllowUniversalAccessFromFileURLs($ARG);

# --- from mastg-android-webview-bridges.yml ---
  - id: mastg-android-webview-bridges-setup
    severity: WARNING
    languages: [java]
    metadata:
      summary: Detects a WebView with JavaScript enabled that also registers a JavaScript native bridge via addJavascriptInterface().
    message: '[MASVS-PLATFORM-2] WebView has JavaScript enabled and a native bridge is registered via addJavascriptInterface()'
    patterns:
      - pattern: $WEBVIEW.addJavascriptInterface($BRIDGE, $_)
      - pattern-inside: |
          $RET $METHOD(...) {
            ...
            $WEBVIEW.getSettings().setJavaScriptEnabled(true);
            ...
          }

  - id: mastg-android-webview-bridges-javascriptinterface
    severity: WARNING
    languages: [java]
    metadata:
      summary: Detects methods annotated with @JavascriptInterface, which are exposed to JavaScript in a WebView bridge.
    message: '[MASVS-PLATFORM-2] Method is exposed to JavaScript via @JavascriptInterface'
    pattern: |
      @JavascriptInterface
      $TYPE $NAME(...) {
        ...
      }

# --- from mastg-android-webview-safebrowsing.yml ---
  - id: mastg-android-webview-safebrowsing-disabled-manifest
    severity: WARNING
    languages:
      - xml
    metadata:
      summary: This rule detects when SafeBrowsing is explicitly disabled for WebViews in the AndroidManifest.xml.
    message: "[MASVS-CODE-4] SafeBrowsing is disabled for WebViews in the AndroidManifest (EnableSafeBrowsing set to false). This removes an important security protection against known malicious URLs."
    patterns:
      - pattern: |
          <meta-data android:name="android.webkit.WebView.EnableSafeBrowsing" android:value="false" ... />

  - id: mastg-android-webview-safebrowsing-disabled-code
    severity: WARNING
    languages:
      - java
    metadata:
      summary: This rule detects when SafeBrowsing is explicitly disabled for WebViews at runtime via WebSettings.setSafeBrowsingEnabled(false).
    message: "[MASVS-CODE-4] SafeBrowsing is disabled for WebViews in code via setSafeBrowsingEnabled(false). This takes precedence over the AndroidManifest and removes an important security protection against known malicious URLs."
    pattern: $WEBSETTINGS.setSafeBrowsingEnabled(false)

# --- from mastg-android-webview-url-handlers.yml ---
  - id: mastg-android-webviewclient-url-handlers
    severity: INFO
    languages:
      - java
    metadata:
      summary: This rule detects WebViewClient methods that intercept URL loading, including shouldOverrideUrlLoading and shouldInterceptRequest.
    message: "[MASVS-CODE-4] Detected WebViewClient URL interception method."
    pattern-either:
      - pattern: |
          class $CLASS extends WebViewClient {
            ...
            $RET shouldOverrideUrlLoading(...) { ... }
            ...
          }
      - pattern: |
          class $CLASS extends WebViewClient {
            ...
            $RET shouldInterceptRequest(...) { ... }
            ...
          }
      - pattern: (WebViewClient $WVC).shouldOverrideUrlLoading(...)
      - pattern: (WebViewClient $WVC).shouldInterceptRequest(...)
      - pattern: $WEBVIEW.setWebViewClient(...)

  - id: mastg-android-webviewclient-safebrowsing-whitelist
    severity: WARNING
    languages:
      - java
    metadata:
      summary: This rule detects usage of SafeBrowsing whitelist or onSafeBrowsingHit callback which may weaken security.
    message: "[MASVS-CODE-4] Detected SafeBrowsing customization that may weaken security."
    pattern-either:
      - pattern: WebView.setSafeBrowsingWhitelist(...)
      - pattern: $WEBVIEW.setSafeBrowsingWhitelist(...)
      - pattern: |
          class $CLASS extends WebViewClient {
            ...
            void onSafeBrowsingHit(...) { ... }
            ...
          }
