# --- from mastg-android-sensitive-data-in-screenshot.yml ---
  - id: mastg-android-flag-secure-enable-flags
    severity: INFO
    languages: [java]
    metadata:
      summary: Window uses FLAG_SECURE to block screenshots.
    message: "[MASVS-PLATFORM] Make sure you use this flag for all screens with sensitive data"
    pattern-either:
      - patterns:
          - pattern: $W.addFlags($F)
          - metavariable-regex:
              metavariable: $F
              regex: ^(FLAG_SECURE|8192|0x2000)$
      - patterns:
          - pattern: $W.setFlags($FLAGS, $FLAGS)
          - metavariable-regex:
              metavariable: $FLAGS
              regex: ^(FLAG_SECURE|8192|0x2000)$

# --- from mastg-android-sql-injection-contentprovider.yml ---
  - id: mastg-android-sql-injection-contentprovider
    severity: WARNING
    languages:
      - java
    metadata:
      summary: The rule detects possible SQL injection in Android ContentProviders via unvalidated URI path segment concatenation.
    message: "[MASVS-CODE-4] Possible SQL Injection: unvalidated user input from `Uri.getPathSegments()` concatenated into `SQLiteQueryBuilder.appendWhere()`"
    patterns:
      - pattern-either:
          - pattern: |
              $QB.appendWhere("..." + $VAR);
          - pattern: |
              $QB.appendWhere($VAR);
      - pattern-inside: |
          $VAR = $URI.getPathSegments().get(...);
          ...

# --- from mastg-android-ssl-socket-hostnameverifier.yml ---
  - id: mastg-android-ssl-socket-hostnameverifier
    severity: WARNING
    languages:
      - java
    metadata:
      summary: This rules scans for the usage of SSLSocket API with a HostnameVerifier.
    message: "Detected usage of SSLSocket API with or without a HostnameVerifier"
    match:
      any:
        - pattern: SSLSocketFactory.getDefault()
        - pattern: (SSLSocketFactory) $_
        - pattern: $SF.createSocket(...)
        - pattern: HttpsURLConnection.getDefaultHostnameVerifier()
        - pattern: $HNV.verify($_, $_)

