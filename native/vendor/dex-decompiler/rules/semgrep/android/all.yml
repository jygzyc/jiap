# All Android Semgrep rules for droid2web / dex-decompiler (WASM-safe single file).
# Combines general.yml (starter Android rules) + OWASP MASTG Android rules.
# Regenerate: python3 droid2web/scripts/merge_android_semgrep_rules.py
#
rules:

# --- from general.yml ---
  - id: android.webview.loadurl-from-intent
    message: >-
      WebView.loadUrl() receives a URL derived from an Intent extra or Uri.
      If the host Activity is exported or deep-linked, an attacker controls
      the URL loaded into an authenticated WebView.
    severity: WARNING
    languages: [java]
    patterns:
      - pattern-either:
          - pattern: |
              $WV.loadUrl((String) $INTENT.getStringExtra(...));
          - pattern: |
              $WV.loadUrl($INTENT.getData().toString());
          - pattern: |
              $WV.loadUrl($INTENT.getData().getQueryParameter(...));
    metadata:
      vuln_class: webview
      chain_tag: deeplink_to_webview
    native:
      kind: source_sink
      sources:
        - getStringExtra
        - getData
        - getDataString
        - getQueryParameter
        - getIntent
      sinks:
        - loadUrl

  - id: android.webview.js-interface-added
    message: >-
      addJavascriptInterface is called. If the WebView later loads attacker
      controlled URLs (deep link, redirect, untrusted HTML), this is RCE.
    severity: WARNING
    languages: [java]
    pattern: $WV.addJavascriptInterface($OBJ, $NAME);
    metadata:
      vuln_class: webview
      chain_tag: js_bridge
    native:
      kind: invoke
      methods:
        - addJavascriptInterface

  - id: android.intent.redirect
    message: >-
      Activity extracts a Parcelable/Intent from an incoming Intent and starts
      it. Classic intent redirection; attacker reaches non-exported components.
    severity: ERROR
    languages: [java]
    pattern-either:
      - pattern: |
          $I = (Intent) getIntent().getParcelableExtra(...);
          ...
          startActivity($I);
      - pattern: |
          $I = getIntent().getParcelableExtra(..., Intent.class);
          ...
          startActivity($I);
    metadata:
      vuln_class: ipc
      chain_tag: intent_redirect
    native:
      kind: source_sink
      sources:
        - getParcelableExtra
        - getParcelableArrayExtra
        - getParcelableArrayListExtra
      sinks:
        - startActivity
        - startActivityForResult
        - startService
        - startForegroundService
        - bindService
        - sendBroadcast

  - id: android.intent.redirect-grant-flags
    message: >-
      Nested Intent from extras reaches addFlags/setFlags/setClipData. Combined
      with FLAG_GRANT_* this smuggles URI permissions to attackers (provider /
      FileProvider access).
    severity: ERROR
    languages: [java]
    patterns:
      - pattern-either:
          - pattern: |
              $I = (Intent) getIntent().getParcelableExtra(...);
              ...
              $I.addFlags(...);
          - pattern: |
              $I = getIntent().getParcelableExtra(..., Intent.class);
              ...
              $I.setFlags(...);
    metadata:
      vuln_class: ipc
      chain_tag: intent_redirect_grant
    native:
      kind: source_sink
      sources:
        - getParcelableExtra
        - getParcelableArrayExtra
        - getParcelableArrayListExtra
      sinks:
        - addFlags
        - setFlags
        - setClipData
        - grantUriPermission

  - id: android.ssl.bypass-handler-proceed
    message: >-
      WebViewClient.onReceivedSslError calls handler.proceed() unconditionally.
      Silently accepts invalid TLS certs; network traffic can be MITMed.
    severity: ERROR
    languages: [java]
    pattern: |
      public void onReceivedSslError(WebView $V, SslErrorHandler $H, SslError $E) {
        ...
        $H.proceed();
        ...
      }
    metadata:
      vuln_class: network
    native:
      kind: method_invoke
      method_name: onReceivedSslError
      methods:
        - proceed

  # --- Curated high-signal extras (careful expand; not full MASTG) ---

  - id: android.pendingintent.get-creation
    message: >-
      PendingIntent.get* creation site. Review FLAG_IMMUTABLE and whether the base
      Intent leaves action/data/component unset (PITracker-style).
    severity: INFO
    languages: [java]
    pattern-either:
      - pattern: PendingIntent.getActivity(...)
      - pattern: PendingIntent.getBroadcast(...)
      - pattern: PendingIntent.getService(...)
      - pattern: PendingIntent.getForegroundService(...)
    metadata:
      vuln_class: ipc
      chain_tag: pending_intent
    native:
      kind: invoke
      methods:
        - PendingIntent.getActivity
        - PendingIntent.getBroadcast
        - PendingIntent.getService
        - PendingIntent.getForegroundService

  - id: android.ssl.check-server-trusted
    message: >-
      Custom TrustManager.checkServerTrusted present. Ensure it validates the chain
      and throws CertificateException on failure (trust-all bypass risk).
    severity: WARNING
    languages: [java]
    pattern: |
      public void checkServerTrusted(...) {
        ...
      }
    metadata:
      vuln_class: network
    native:
      kind: invoke
      methods:
        - checkServerTrusted

  - id: android.deserialization.read-object
    message: >-
      ObjectInputStream.readObject / similar deserialization. Prefer JSON with an
      explicit schema when input is untrusted.
    severity: ERROR
    languages: [java]
    pattern: $IN.readObject();
    metadata:
      vuln_class: ipc
    native:
      kind: invoke
      methods:
        - readObject
        - ObjectInputStream.readObject

  - id: android.crypto.secret-key-spec
    message: >-
      SecretKeySpec constructed in app code. Confirm key material is not hardcoded.
    severity: WARNING
    languages: [java]
    pattern: new SecretKeySpec(...);
    metadata:
      vuln_class: storage
    native:
      kind: invoke
      methods:
        - SecretKeySpec.<init>

  - id: android.webview.file-access-from-file-urls
    message: >-
      WebView allows file:// access from file URLs, enabling local file theft when
      combined with attacker-controlled content.
    severity: ERROR
    languages: [java]
    pattern-either:
      - pattern: $S.setAllowFileAccessFromFileURLs(true);
      - pattern: $S.setAllowUniversalAccessFromFileURLs(true);
    metadata:
      vuln_class: webview
    native:
      kind: invoke
      methods:
        - setAllowFileAccessFromFileURLs
        - setAllowUniversalAccessFromFileURLs

  - id: android.rce.dex-class-loader
    message: >-
      Dynamic DEX loading (DexClassLoader / PathClassLoader / InMemoryDexClassLoader).
      Untrusted paths can lead to code execution.
    severity: ERROR
    languages: [java]
    pattern-either:
      - pattern: new DexClassLoader(...);
      - pattern: new PathClassLoader(...);
      - pattern: new InMemoryDexClassLoader(...);
    metadata:
      vuln_class: native
    native:
      kind: invoke
      methods:
        - DexClassLoader.<init>
        - PathClassLoader.<init>
        - InMemoryDexClassLoader.<init>

  - id: android.webview.cookie-with-intent-url
    message: >-
      CookieManager is used in the same method as Intent-driven WebView navigation.
      Attackers who control the loaded URL can steal session cookies (TikTok CVE-2022-28799).
    severity: ERROR
    languages: [java]
    patterns:
      - pattern-either:
          - pattern: |
              $WV.loadUrl($URL);
              ...
              CookieManager.getInstance().getCookie(...);
          - pattern: |
              CookieManager.getInstance().setCookie(...);
              ...
              $WV.loadUrl($URL);
    metadata:
      vuln_class: webview
      chain_tag: webview_cookie_exfil
      cwe: CWE-201
    native:
      kind: source_sink
      sources:
        - getStringExtra
        - getData
        - getDataString
        - getQueryParameter
      sinks:
        - CookieManager.getCookie
        - CookieManager.setCookie
        - android.webkit.CookieManager.getCookie
        - android.webkit.CookieManager.setCookie

  - id: android.zip.slip
    message: >-
      ZipEntry.getName() is used to build a File / FileOutputStream path without
      getCanonicalPath containment checks (ZipSlip). Crafted ../ entries can
      overwrite files outside the extract directory.
    severity: ERROR
    languages: [java]
    patterns:
      - pattern-either:
          - pattern: |
              $N = $E.getName();
              ...
              new File($DIR, $N);
          - pattern: |
              new File($DIR, $E.getName());
          - pattern: |
              new FileOutputStream(new File($DIR, $E.getName()));
    metadata:
      vuln_class: storage
      chain_tag: zip_slip
      cwe: CWE-22
    native:
      kind: source_sink
      sources:
        - ZipEntry.getName
        - ZipArchiveEntry.getName
      sinks:
        - File.<init>
        - FileOutputStream.<init>
        - FileUtils.copy

  - id: android.intent.parse-uri
    message: >-
      Intent.parseUri result is launched. intent:// URLs can reach non-exported
      components from WebView or deeplinks.
    severity: ERROR
    languages: [java]
    patterns:
      - pattern-either:
          - pattern: |
              startActivity(Intent.parseUri(...));
          - pattern: |
              $I = Intent.parseUri(...);
              ...
              startActivity($I);
    metadata:
      vuln_class: ipc
      cwe: CWE-926
    native:
      kind: source_sink
      sources:
        - parseUri
        - Intent.parseUri
      sinks:
        - startActivity
        - startActivityForResult
        - startService

  - id: android.customtabs.intent-url
    message: >-
      CustomTabsIntent.launchUrl receives a URL derived from Intent extras or
      Uri data. Attackers can open phishing/OAuth pages in an app-branded session.
    severity: WARNING
    languages: [java]
    patterns:
      - pattern-either:
          - pattern: |
              $CT.launchUrl($CTX, Uri.parse($INTENT.getStringExtra(...)));
          - pattern: |
              $CT.launchUrl($CTX, $INTENT.getData());
    metadata:
      vuln_class: network
      chain_tag: custom_tabs_intent_url
      cwe: CWE-939
    native:
      kind: source_sink
      sources:
        - getStringExtra
        - getData
        - getDataString
        - getQueryParameter
      sinks:
        - CustomTabsIntent.launchUrl
        - launchUrl

  - id: android.broadcast.intent-redirect
    message: >-
      BroadcastReceiver extracts a Parcelable Intent from extras and starts it.
      install_complete / PACKAGE_ADDED style broadcasts become confused-deputy
      redirects (Samsung Galaxy Store AppLinker).
    severity: ERROR
    languages: [java]
    patterns:
      - pattern-either:
          - pattern: |
              public void onReceive(...) {
                ...
                $I = (Intent) $INTENT.getParcelableExtra(...);
                ...
                startActivity($I);
              }
          - pattern: |
              $I = $INTENT.getParcelableExtra(..., Intent.class);
              ...
              startActivity($I);
    metadata:
      vuln_class: ipc
      chain_tag: broadcast_intent_redirect
      cwe: CWE-926
    native:
      kind: source_sink
      sources:
        - getParcelableExtra
        - getParcelableArrayExtra
        - getParcelableArrayListExtra
      sinks:
        - startActivity
        - startActivityForResult
        - startService
        - startForegroundService
        - bindService

  - id: android.broadcast.sensitive-extras
    message: >-
      sendBroadcast may carry sensitive extras (IMSI/token/phone). Implicit
      broadcasts are readable by any registered receiver.
    severity: WARNING
    languages: [java]
    patterns:
      - pattern-either:
          - pattern: |
              $I.putExtra("imsi", $V);
              ...
              sendBroadcast($I);
          - pattern: |
              $I.putExtra(..., $TOKEN);
              ...
              sendBroadcast($I);
    metadata:
      vuln_class: ipc
      chain_tag: sensitive_broadcast
      cwe: CWE-925
    native:
      kind: source_sink
      sources:
        - getSubscriberId
        - getImei
        - getDeviceId
        - getLine1Number
        - getAuthToken
        - getAccessToken
        - getToken
        - getPassword
        - getStringExtra
      sinks:
        - sendBroadcast
        - sendOrderedBroadcast
        - sendStickyBroadcast

  - id: android.receiver.command-sink
    message: >-
      BroadcastReceiver.onReceive invokes a dangerous side-effect API. If the
      receiver is exported, any app can trigger it (FactoryCamera-style).
    severity: ERROR
    languages: [java]
    patterns:
      - pattern-either:
          - pattern: |
              public void onReceive(...) {
                ...
                Runtime.getRuntime().exec(...);
              }
          - pattern: |
              public void onReceive(...) {
                ...
                $PM.setComponentEnabledSetting(...);
              }
    metadata:
      vuln_class: ipc
      chain_tag: command_receiver
      cwe: CWE-925
    native:
      kind: invoke
      methods:
        - Runtime.exec
        - ProcessBuilder.start
        - setComponentEnabledSetting
        - MediaRecorder.start
        - Camera.open
        - openFileOutput
        - grantUriPermission
        - installPackage

  - id: android.sql.provider-injection
    message: >-
      ContentProvider query path builds SQL from Uri/Intent input without bind
      args (Samsung Billing IAPService-style SQLi).
    severity: ERROR
    languages: [java]
    patterns:
      - pattern-either:
          - pattern: |
              $DB.rawQuery($SQL + $URI.getQueryParameter(...), ...);
          - pattern: |
              $DB.rawQuery($URI.getLastPathSegment(), ...);
          - pattern: |
              $DB.execSQL($SQL + $INPUT);
    metadata:
      vuln_class: storage
      chain_tag: provider_sql_injection
      cwe: CWE-89
    native:
      kind: source_sink
      sources:
        - getStringExtra
        - getQueryParameter
        - getLastPathSegment
        - getPathSegments
        - getDataString
        - getPath
      sinks:
        - rawQuery
        - execSQL
        - compileStatement

# --- from mastg-android-asymmetric-key-pair-used-for-multiple-purposes.yml ---
  - id: mastg-android-asymmetric-key-pair-used-for-multiple-purposes
    severity: WARNING
    languages:
      - java
    metadata:
      summary: Detects usage of KeyGenParameterSpec.Builder to collect observations for key-purposes evaluation.
    message: |
      [MASVS-CRYPTO-1] Detected usage of KeyGenParameterSpec.Builder. Review the configured purposes to ensure key separation (avoid mixing encryption/decryption with signing/verification or wrapping).

    # Match any construction of KeyGenParameterSpec.Builder, capturing alias and purposes.
    pattern: |
      new KeyGenParameterSpec.Builder($ALIAS, $PURPOSES)

# --- from mastg-android-backup-manifest.yml ---
  - id: mastg-android-backup-manifest-allow-backup
    severity: WARNING
    languages:
      - xml
    metadata:
      summary: This rule inspects the AndroidManifest.xml for allowBackup.
      references:
        - https://developer.android.com/guide/topics/data/autobackup
    message: "[MASVS-STORAGE-2] allowBackup detected as $ARG."
    patterns:
      - pattern: 'android:allowBackup="$ARG"'
  - id: mastg-android-backup-manifest-backup-rules
    severity: WARNING
    languages:
      - xml
    metadata:
      summary: This rule inspects the AndroidManifest.xml for backup rules.
      references:
        - https://developer.android.com/guide/topics/data/autobackup
    message: "[MASVS-STORAGE-2] Backup rules detected."
    pattern-either:
      - pattern: 'android:fullBackupContent="@xml/backup_rules"'
      - pattern: 'android:dataExtractionRules="@xml/data_extraction_rules"'

# --- from mastg-android-biometric-device-credential-fallback.yml ---
  - id: mastg-android-biometric-device-credential-fallback
    languages:
      - java
    severity: WARNING
    metadata:
      summary: This rule detects BiometricPrompt configurations that allow fallback to device credentials for the android.hardware.biometrics and androidx.biometric class.
    message: "[MASVS-AUTH-3] BiometricPrompt allows fallback to device credentials. For sensitive operations, consider using BIOMETRIC_STRONG only."
    pattern-either:
    # decompiled code contains integer values instead of the constants for biometric authentication:
    #  BIOMETRIC_STRONG = 15 (0x000F)
    #  BIOMETRIC_WEAK = 255 (0x00FF)
    #  DEVICE_CREDENTIAL = 32768 (0x8000)

      # this pattern matches for the usage of setAllowedAuthenticators() in the android.hardware.biometrics class - see https://developer.android.com/reference/android/hardware/biometrics/BiometricPrompt.Builder#setAllowedAuthenticators(int)
      - patterns:
          - pattern: $BUILDER.setAllowedAuthenticators($VALUE)
          - metavariable-pattern:
              metavariable: $VALUE
              patterns:
                - pattern-not: BiometricManager.Authenticators.BIOMETRIC_STRONG
                - pattern-not: 15

      # this pattern matches for the usage of canAuthenticate() in the androidx Biometric class - see https://developer.android.com/reference/androidx/biometric/BiometricManager#canAuthenticate(int)
      - patterns: 
          - pattern: $BM.canAuthenticate($VALUE)
          - metavariable-pattern:
              metavariable: $VALUE
              patterns:
                - pattern-not: BiometricManager.Authenticators.BIOMETRIC_STRONG
                - pattern-not: 15
      - pattern: |
          $BUILDER.setDeviceCredentialAllowed(true)

# --- from mastg-android-biometric-event-bound.yml ---
  - id: mastg-android-biometric-event-bound
    languages:
      - java
      - kotlin
    severity: WARNING
    metadata:
      summary: This rule detects uses of BiometricPrompt.authenticate without a CryptoObject (event-bound biometric authentication) and insecure key configurations.
    message: "[MASVS-AUTH-2] BiometricPrompt.authenticate called without a CryptoObject or key not requiring user authentication. Use authenticate(PromptInfo, CryptoObject) with a keystore-backed key configured with setUserAuthenticationRequired(true) for sensitive operations."

    pattern-either:
      # Pattern 1: BiometricPrompt.authenticate() without CryptoObject (event-bound authentication)
      # Used in androidx Biometric library
      - patterns:
          - pattern: $INSTANCE.authenticate($PROMPT_INFO)
          - pattern-not: $ANY.authenticate($PROMPT_INFO, $CRYPTO_OBJECT)
          - pattern-inside: |
              import androidx.biometric.BiometricPrompt;
              ...

      # Pattern 2: android.hardware.biometrics.BiometricPrompt.authenticate() without CryptoObject
      # This is the older Android framework API (deprecated in favor of androidx.biometric)
      # The insecure version has 3 parameters: authenticate(CancellationSignal, Executor, Callback)
      # The secure version has 4 parameters: authenticate(CryptoObject, CancellationSignal, Executor, Callback)
      - patterns:
          - pattern: $INSTANCE.authenticate($CANCEL, $EXECUTOR, $CALLBACK)
          - pattern-not: $ANY.authenticate($CRYPTO_OBJECT, $CANCEL, $EXECUTOR, $CALLBACK)
          - pattern-inside: |
              import android.hardware.biometrics.BiometricPrompt;
              ...

      # Pattern 3a: KeyGenParameterSpec.Builder without setUserAuthenticationRequired(true)
      # Scoped to files using android.hardware.biometrics.BiometricPrompt to avoid false positives on non-biometric keys
      - patterns:
          - pattern: new KeyGenParameterSpec.Builder(...)
          - pattern-not-inside: |
              new KeyGenParameterSpec.Builder(...). ... .setUserAuthenticationRequired(true)
          - pattern-inside: |
              import android.hardware.biometrics.BiometricPrompt;
              ...

      # Pattern 3b: Same check but for androidx.biometric library
      - patterns:
          - pattern: new KeyGenParameterSpec.Builder(...)
          - pattern-not-inside: |
              new KeyGenParameterSpec.Builder(...). ... .setUserAuthenticationRequired(true)
          - pattern-inside: |
              import androidx.biometric.BiometricPrompt;
              ...

# --- from mastg-android-biometric-invalidated-enrollment.yml ---
  - id: mastg-android-biometric-invalidated-enrollment
    languages:
      - java
      - kotlin
    severity: WARNING
    metadata:
      summary: This rule detects KeyGenParameterSpec configurations that disable key invalidation on biometric enrollment changes.
    message: "[MASVS-AUTH-2] Key configured with setInvalidatedByBiometricEnrollment(false). For sensitive operations, keys should be invalidated when biometric enrollment changes to prevent unauthorized access by newly enrolled biometrics."

    pattern: $BUILDER.setInvalidatedByBiometricEnrollment(false)

# --- from mastg-android-biometric-no-confirmation-required.yml ---
  - id: mastg-android-biometric-no-confirmation-required
    languages:
      - java
    severity: WARNING
    metadata:
      summary: This rule detects BiometricPrompt configurations that disable explicit user confirmation.
    message: "[MASVS-AUTH-3] BiometricPrompt allows authentication without explicit user confirmation. For sensitive operations, consider using setConfirmationRequired(true)."
    pattern: |
      $BUILDER.setConfirmationRequired(false)

# --- from mastg-android-biometric-validity-duration.yml ---
  - id: mastg-android-biometric-validity-duration
    languages:
      - java
      - kotlin
    severity: WARNING
    metadata:
      summary: This rule detects KeyGenParameterSpec configurations with extended authentication validity duration (non-zero timeout).
    message: "[MASVS-AUTH-2] Key configured with authentication validity duration > 0. For sensitive operations, use setUserAuthenticationParameters(0, type) to require authentication for every cryptographic operation."

    pattern-either:
      # Pattern 1: setUserAuthenticationParameters with non-zero duration
      - patterns:
          - pattern: $BUILDER.setUserAuthenticationParameters($DURATION, ...)
          - metavariable-comparison:
              metavariable: $DURATION
              comparison: $DURATION > 0

      # Pattern 2: Deprecated setUserAuthenticationValidityDurationSeconds with non-zero duration
      - patterns:
          - pattern: $BUILDER.setUserAuthenticationValidityDurationSeconds($DURATION)
          - metavariable-comparison:
              metavariable: $DURATION
              comparison: $DURATION > 0

# --- from mastg-android-broken-encryption-algorithms.yaml ---
  - id: mastg-android-broken-encryption-algorithms
    languages:
      - java
    severity: WARNING
    metadata:
      summary: This rule looks for broken encryption algorithms.
    message: "[MASVS-CRYPTO-1] Broken encryption algorithms found in use."
    pattern-regex: Cipher\.getInstance\("?(DES|DESede|RC4|Blowfish)(/[A-Za-z0-9]+(/[A-Za-z0-9]+)?)?"?\)

# --- from mastg-android-broken-encryption-modes.yaml ---
  - id: mastg-android-broken-encryption-modes
    languages:
      - java
    severity: WARNING
    metadata:
      summary: This rule looks for broken encryption modes.
    message: "[MASVS-CRYPTO-1] Broken encryption modes found in use."
    pattern-either:
      - pattern: Cipher.getInstance("AES")
      - pattern-regex: Cipher\.getInstance\("?[A-Za-z0-9]+/ECB(/[A-Za-z0-9]+)?"?\)

# --- from mastg-android-content-provider-exported.yml ---
  - id: mastg-android-provider-permission-protected
    languages: [xml]
    severity: WARNING
    metadata:
      summary: Detects provider-level permission protection on a ContentProvider.
      masvs:
        - MASVS-PLATFORM
    message: >
      [MASVS-PLATFORM] The ContentProvider declares permission protection.
      Verify that the permission strength matches the intended trust boundary.
    pattern-either:
      - pattern: |
          <provider ... android:permission="$PERM" ... />
      - pattern: |
          <provider ... android:readPermission="$PERM" ... />
      - pattern: |
          <provider ... android:writePermission="$PERM" ... />

  - id: mastg-android-provider-exported-without-permissions
    languages: [xml]
    severity: WARNING
    metadata:
      summary: Detects an exported ContentProvider without any read or write permission enforcement.
      masvs:
        - MASVS-PLATFORM
    message: >
      [MASVS-PLATFORM] The ContentProvider is exported without
      android:readPermission, android:writePermission, or android:permission,
      allowing any app on the device to access it without restriction.
    patterns:
      - pattern: <provider ... android:exported="true" ... />
      - pattern-not: <provider ... android:permission="$PERM" ... />
      - pattern-not: <provider ... android:readPermission="$PERM" ... />
      - pattern-not: <provider ... android:writePermission="$PERM" ... />

# --- from mastg-android-custom-deeplink-scheme.yml ---
  - id: mastg-android-custom-deeplink-scheme
    severity: INFO
    languages:
      - xml
    metadata:
      summary: This rule looks for custom (non http/https) URL scheme deep links declared in the Android Manifest.
    message: '[MASVS-PLATFORM] Custom deeplink scheme detected in an intent-filter (potentially exposed deeplink). Any app on the device can invoke this handler.'
    patterns:
      - pattern: <data ... android:scheme="$SCHEME" ... />
      - metavariable-regex:
          metavariable: $SCHEME
          regex: ^(?!https?$).+$
      - pattern-inside: |
          <activity ...>
            ...
          </activity>
      - pattern-inside: |
          <intent-filter ...>
            ...
            <action android:name="android.intent.action.VIEW" />
            ...
          </intent-filter>
      - pattern-inside: |
          <intent-filter ...>
            ...
            <category android:name="android.intent.category.BROWSABLE" />
            ...
          </intent-filter>

# --- from mastg-android-dangerous-app-permissions.yaml ---
  - id: detect-dangerous-android-permissions
    languages:
      - xml
    message: "Dangerous Android permission found:"
    severity: WARNING
    pattern-either:
      - pattern: <uses-permission android:name="android.permission.READ_CONTACTS"/>
      - pattern: <uses-permission android:name="android.permission.WRITE_CONTACTS"/>
      - pattern: <uses-permission android:name="android.permission.READ_CALENDAR"/>
      - pattern: <uses-permission android:name="android.permission.WRITE_CALENDAR"/>
      - pattern: <uses-permission android:name="android.permission.SEND_SMS"/>
