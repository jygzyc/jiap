# --- from mastg-android-deeplink-autoverify-missing.yml ---
  - id: mastg-android-deeplink-autoverify-missing
    severity: WARNING
    languages:
      - xml
    metadata:
      summary: This rule looks for http/https deep links declared without App Links verification.
    message: '[MASVS-PLATFORM] Deep link intent filter missing android:autoVerify="true", enabling malicious apps to hijack links.'
    patterns:
      - pattern: <data ... android:scheme="$SCHEME" ... />
      - metavariable-regex:
          metavariable: $SCHEME
          regex: ^https?$
      - pattern-inside: |
          <activity ...>
            ...
          </activity>
      - pattern-inside: |
          <intent-filter ...>
            ...
            <action android:name="android.intent.action.VIEW" />
            ...
          </intent-filter>
      - pattern-inside: |
          <intent-filter ...>
            ...
            <category android:name="android.intent.category.BROWSABLE" />
            ...
          </intent-filter>
      - pattern-not-inside: |
          <intent-filter ... android:autoVerify="true" ...>
            ...
          </intent-filter>

# --- from mastg-android-deeplink-unvalidated-parameter.yml ---
  - id: mastg-android-deeplink-unvalidated-parameter
    severity: WARNING
    languages:
      - java
    metadata:
      summary: This rule locates the deep link handler entry point and the URI parameters it reads.
    message: '[MASVS-PLATFORM] A deep link handler reads the incoming URI (getIntent/getData) and/or extracts a parameter (getQueryParameter). Verify each value is validated (type conversion, bounds, or sanitization) before it is used.'
    pattern-either:
      - pattern: $INTENT.getData()
      - pattern: $URI.getQueryParameter(...)

# --- from mastg-android-device-passcode-present.yml ---
