              - pattern: prefs().getStringSet(...)
              - pattern: prefs().getInt(...)
              - pattern: prefs().getLong(...)
              - pattern: prefs().getFloat(...)
              - pattern: prefs().getBoolean(...)

  - id: mastg-android-hmac-validation-present
