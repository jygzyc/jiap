# --- from mastg-android-fileprovider-broad-scope.yml ---
  - id: mastg-android-fileprovider-broad-path-scope
    languages: [xml]
    severity: WARNING
    metadata:
      summary: Detects FileProvider path elements declared with an overly broad scope (path=".").
      masvs:
        - MASVS-PLATFORM
      references:
        - https://developer.android.com/reference/androidx/core/content/FileProvider#specifying-available-files
    message: >
      [MASVS-PLATFORM] FileProvider path element is declared with path=".",
      which maps the entire corresponding base directory into the provider's
      addressable namespace. Any file under that directory becomes reachable
      through FileProvider.getUriForFile(), including secrets or files added
      later. Narrow the path to a specific subdirectory containing only files
      intended for sharing (e.g. path="reports/").
    pattern-either:
      - pattern: |
          <files-path ... path="." ... />
      - pattern: |
          <cache-path ... path="." ... />
      - pattern: |
          <external-path ... path="." ... />
      - pattern: |
          <external-files-path ... path="." ... />
      - pattern: |
          <external-cache-path ... path="." ... />

  - id: mastg-android-fileprovider-root-path
    languages: [xml]
    severity: WARNING
    metadata:
      summary: Detects use of <root-path> in FileProvider configuration.
      masvs:
        - MASVS-PLATFORM
      references:
        - https://developer.android.com/reference/androidx/core/content/FileProvider#specifying-available-files
    message: >
      [MASVS-PLATFORM] FileProvider declares <root-path>, which maps the
      provider root to the device root filesystem ("/"). This scope is far
      too broad for secure file sharing and should be replaced with a narrower
      path element such as <files-path> or <cache-path> scoped to a specific
      subdirectory.
    pattern: |
      <root-path ... />

# --- from mastg-android-hardcoded-crypto-keys-usage.yml ---
  - id: mastg-android-hardcoded-crypto-keys-usage
    severity: WARNING
    languages:
      - java
    metadata:
      summary: This rule looks for hardcoded keys in use.
    message: "[MASVS-CRYPTO-1] Hardcoded cryptographic keys found in use."
    pattern-either:
      - pattern: SecretKeySpec $_ = new SecretKeySpec($KEY, $ALGO);
      - pattern: |-
          byte[] $KEY = {...};
          ...
          new SecretKeySpec($KEY, $ALGO);

# --- from mastg-android-hardcoded-security-provider.yaml ---
  - id: mastg-android-hardcoded-security-provider
    languages:
      - java
    severity: WARNING
    metadata:
      summary: This rule looks for explicitly specified security providers in getInstance calls.
    message: "[MASVS-CRYPTO-1] Explicitly specified security provider found. Do not hardcode a provider unless using AndroidKeyStore."
    patterns:
      - pattern-either:
          - pattern: $X.getInstance($ALGO, $PROVIDER)
          - pattern: $X.getInstance($ALGO, (String $PROVIDER))
          - pattern: $X.getInstance($ALGO, (java.security.Provider $PROVIDER))
      - pattern-not: KeyStore.getInstance("AndroidKeyStore")
      - metavariable-regex:
          metavariable: $X
          regex: (Cipher|KeyGenerator|KeyPairGenerator|MessageDigest|Signature|Mac|SecretKeyFactory|KeyFactory|SecureRandom|KeyAgreement|AlgorithmParameters|AlgorithmParameterGenerator|CertificateFactory|CertPathBuilder|CertPathValidator|CertStore|KeyStore)

# --- from mastg-android-implicit-intent-internal-communication.yml ---
  - id: mastg-android-implicit-intent-internal-communication
    patterns:
      - pattern: |
          $INTENT = new Intent(...);
          ...
          $INTENT.setAction($ACTION);
          ...
          $CONTEXT.startActivity($INTENT);
      - pattern-not: |
          $INTENT = new Intent(...);
          ...
          $INTENT.setPackage(...);
          ...
          $CONTEXT.startActivity($INTENT);
      - pattern-not: |
          $INTENT = new Intent(...);
          ...
          $INTENT.setComponent(...);
          ...
          $CONTEXT.startActivity($INTENT);
      - pattern-not: |
          $INTENT = new Intent($CONTEXT, $CLASS);
          ...
          $CONTEXT.startActivity($INTENT);
    message: "[MASVS-CODE-4] The app uses an implicit intent for internal component communication. Use explicit intents by specifying the package or component."
    languages: [java]
    severity: WARNING
    metadata:
      summary: Detects implicit intents used for internal component communication without specifying a package or component.

# --- from mastg-android-implicit-intent-leaking-extras.yml ---
  - id: mastg-android-implicit-intent-leaking-extras
    patterns:
      - pattern: |
          $I = new Intent(...);
          ...
          $I.putExtra($KEY, $VAL);
          ...
          $CTX.startActivity($I);
      - pattern-not: |
          $I = new Intent($C, $CLASS);
          ...
      - pattern-not: |
          $I = new Intent(...);
          ...
          $I.setPackage(...);
          ...
          $CTX.startActivity($I);
      - pattern-not: |
          $I = new Intent(...);
          ...
          $I.setComponent(...);
          ...
          $CTX.startActivity($I);
    message: "[MASVS-CODE-4] The app sends an implicit intent with extras. Any app that registers for this action can receive the data. Use explicit intents for internal communication."
    languages: [java]
    severity: WARNING
    metadata:
      summary: Detects implicit intents that carry extras without specifying a target package or component.

