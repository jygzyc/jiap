[package]
name = "dex-decompiler"
version = "0.1.0"
edition = "2021"
description = "DEX to Java decompiler in pure Rust"
license = "Apache-2.0"

[dependencies]
dex-bytecode = { git = "https://github.com/androguard/dex-bytecode.git" }
dex-parser = { git = "https://github.com/androguard/dex-parser", branch = "main" }
thiserror = "2.0.18"
anyhow = "1.0"
clap = { version = "4", features = ["derive"] }
colored = "2.1"
indicatif = "0.18.3"
rayon = "1.10"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
# deflate-only so WASM builds (droid2web / dex-decompiler-wasm) stay free of zstd-sys/bzip2.
zip = { version = "0.6", default-features = false, features = ["deflate"] }

[lib]
name = "dex_decompiler"
path = "src/lib.rs"

[[bin]]
name = "dex-decompile"
path = "src/bin/dex-decompile.rs"

# Local siblings: Arc-backed DexFile for parallel decompile/taint/detectors.
[patch."https://github.com/androguard/dex-parser"]
dex-parser = { path = "../dex-parser/dexparser-rs" }

[patch."https://github.com/androguard/dex-bytecode.git"]
dex-bytecode = { path = "../dex-bytecode/dex-bytecode" }
