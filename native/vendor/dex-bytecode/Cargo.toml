[workspace]
resolver = "2"

members = ["dex-bytecode", "dex-bytecode-py"]

# From repo root, `cargo run dex-bytecode-dis ...` builds only dex-bytecode (not the Python
# bindings), so you can run the disassembler without compiling PyO3/linking Python.
default-members = ["dex-bytecode"]

[profile.test]
opt-level = 0

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
