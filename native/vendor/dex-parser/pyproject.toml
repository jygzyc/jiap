[build-system]
requires = ["maturin>=1.4,<2"]
build-backend = "maturin"

[project]
name = "dexparser-ag"
readme = "README.md"
license = { file = "LICENSE" }
keywords = ["Android", "Androguard", "Security"]
description = "DEX Parser (Rust core with Python bindings)"
requires-python = ">=3.10"
authors = [{ name = "anthony", email = "ping@42.bzh" }]
dynamic = ["version"]

classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Software Development",
    "Topic :: Utilities",
]

[project.scripts]
dexparser = "dexparser.main:app"

[tool.maturin]
manifest-path = "dexparser-py/Cargo.toml"
module-name = "dexparser_rs"
python-packages = ["dexparser"]
features = ["pyo3/extension-module"]

[tool.setuptools_scm]
version_file = "dexparser/__version__.py"

[tool.black]
line-length = 79
skip-string-normalization = true
