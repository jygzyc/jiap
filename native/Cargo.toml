[workspace]
resolver = "2"
members = [
    "vendor/dex-parser/dexparser-rs",
    "vendor/dex-bytecode/dex-bytecode",
    "vendor/dex-decompiler",
    "vendor/rusty-dex",
    "vendor/dexdec",
    "crates/decx-core",
    "crates/decx-server",
    "crates/decx-cli",
]

# dex-decompiler's git deps (dex-parser / dex-bytecode) are patched to the
# vendored copies above. cargo only honors [patch] in the workspace root, so
# the patch table was moved here from vendor/dex-decompiler/Cargo.toml.
[patch."https://github.com/androguard/dex-parser"]
dex-parser = { path = "vendor/dex-parser/dexparser-rs" }

[patch."https://github.com/androguard/dex-bytecode.git"]
dex-bytecode = { path = "vendor/dex-bytecode/dex-bytecode" }

[workspace.package]
edition = "2021"
license = "Apache-2.0"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "2"
regex = "1"
rayon = "1.10"

# Release profile. NOTE: fat LTO (`lto = "fat"`, codegen-units = 1) miscompiles
# the server binary at startup on windows-gnu / rustc 1.93 (segfault before
# main); thin LTO keeps near-fat performance and builds correctly. See
# native/RESEARCH.md.
[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
