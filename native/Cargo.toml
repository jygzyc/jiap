[workspace]
resolver = "2"
members = [
    "vendor/rusty-dex",
    "vendor/dexdec",
    "crates/decx-core",
    "crates/decx-server",
    "crates/decx-cli",
]

[workspace.package]
edition = "2021"
license = "Apache-2.0"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "2"
regex = "1"
rayon = "1.10"

# Release profile. NOTE: LTO (fat AND thin) miscompiles the server binary on
# windows-gnu / rustc 1.93 — the process segfaults at startup even on paths
# that never touch the engine. Plain opt-level=3 with default codegen-units
# builds and runs correctly; per-crate inlining still applies. See
# native/RESEARCH.md §4.
[profile.release]
opt-level = 2
lto = false
codegen-units = 1
