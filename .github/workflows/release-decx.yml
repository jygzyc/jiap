name: Release Decx

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7

    - name: Verify tag matches version file
      run: |
        TAG_VERSION="${GITHUB_REF_NAME#v}"
        FILE_VERSION="$(tr -d '[:space:]' < version)"
        echo "tag version: $TAG_VERSION"
        echo "version file: $FILE_VERSION"
        if [ "$TAG_VERSION" != "$FILE_VERSION" ]; then
          echo "::error::Tag '${GITHUB_REF_NAME}' does not match version file '${FILE_VERSION}'. Update the version file and re-tag."
          exit 1
        fi

    - name: Set version
      id: version
      run: |
        VERSION="${GITHUB_REF_NAME#v}"
        echo "value=$VERSION" >> $GITHUB_OUTPUT
        # Versions with a prerelease suffix (e.g. 4.2.0-rc.1) publish as GitHub prereleases.
        case "$VERSION" in
          *-*) echo "prerelease=true" >> $GITHUB_OUTPUT ;;
          *)   echo "prerelease=false" >> $GITHUB_OUTPUT ;;
        esac

    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v6.3.0

    - name: Build with Gradle
      run: ./gradlew test dist
      working-directory: decx

    - name: Verify release artifacts
      run: |
        ls -la decx/build/dist/
        test -f "decx/build/dist/jadx_decx_plugin-${{ steps.version.outputs.value }}.jar"
        test -f "decx/build/dist/decx-server-${{ steps.version.outputs.value }}.jar"

    - name: Create Release
      uses: softprops/action-gh-release@v3
      with:
        tag_name: ${{ github.ref_name }}
        name: ${{ github.ref_name }}
        files: |
          decx/build/dist/jadx_decx_plugin-${{ steps.version.outputs.value }}.jar
          decx/build/dist/decx-server-${{ steps.version.outputs.value }}.jar
        body_path: RELEASE.md
        draft: false
        prerelease: ${{ steps.version.outputs.prerelease == 'true' }}
        generate_release_notes: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Build the native (Rust) server for every supported platform and attach the
  # binaries to the same release. Asset naming:
  #   decx-native-server-<version>-<rust-target>[.exe]
  # Users drop the binary into DECX_HOME/bin as decx-native-server[.exe] (or
  # point DECX_NATIVE_SERVER at it); findDecxNativeServer picks it up from there.
  release-native:
    needs: release
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            exe-suffix: .exe
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            exe-suffix: ""
          # The macOS SDK is universal, so x86_64 cross-compiles fine on the
          # arm64 runner; no Intel-hosted runner needed.
          - os: macos-latest
            target: aarch64-apple-darwin
            exe-suffix: ""
          - os: macos-latest
            target: x86_64-apple-darwin
            exe-suffix: ""
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v7

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: ${{ matrix.target }}

    - name: Build decx-native-server
      working-directory: decx-native
      run: cargo build --release --target ${{ matrix.target }}

    - name: Run native tests
      working-directory: decx-native
      run: cargo test --release --target ${{ matrix.target }} -p decx-core

    - name: Attach binary to release
      uses: softprops/action-gh-release@v3
      with:
        tag_name: ${{ github.ref_name }}
        files: decx-native/target/${{ matrix.target }}/release/decx-native-server${{ matrix.exe-suffix }}
        rename: decx-native-server-${{ github.ref_name }}-${{ matrix.target }}${{ matrix.exe-suffix }}
        generate_release_notes: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
